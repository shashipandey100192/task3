<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>this is my container</h1>
    <input type="button" value="click to bg" onclick="cleart()">
    <script>
        function xyz() {
            var bg = "green";
            document.bgColor = bg;
        }

        var y = setTimeout("xyz()", 500000);

        function cleart() {
            clearTimeout(y);
            xyz();
        }
    </script>


</body>

</html>
