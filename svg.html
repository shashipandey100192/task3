<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0 auto;
            padding:0;
        }
        svg,div
        {
            width:550px;
            height: 550px;
            border:2px solid black;
        }
    </style>
</head>
<body>


<div>
<svg>

<rect x="" y="" width="200" height="200" fill="red" stroke="black" stroke-width="2"></rect>
<rect x="350" y="" width="200" height="200" fill="green" stroke="black" stroke-width="2"></rect>
<rect x="350" y="350" width="200" height="200" fill="blue" stroke="black" stroke-width="2"></rect>
<rect x="0" y="350" width="200" height="200" fill="orange" stroke="black" stroke-width="2"></rect>
<line x1="250" y1="0" x2="250" y2="550" stroke="black" stroke-width="2"></line>
<line x1="300" y1="0" x2="300" y2="550" stroke="black" stroke-width="2"></line>
<line x1="0" y1="250" x2="550" y2="250" stroke="black" stroke-width="2"></line>
<line x1="0" y1="300" x2="550" y2="300" stroke="black" stroke-width="2"></line>
<polygon points="200 200,350 200,275 275" fill="green" stroke="black" stroke-width="2"></polygon>
<circle cx="50" cy="50" r="30"></circle>
<circle cx="150" cy="50" r="30"></circle>
<circle cx="150" cy="150" r="30"></circle>
<circle cx="50" cy="150" r="30"></circle>
<text x="250" y="250" font-size="40" font-family="arial black" fill="white">Ludo</text>

</svg>
</div>
</body>
</html>
